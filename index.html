<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- style-src needs unsafe-inline for react-window's inline row positioning.
         frame-ancestors left out on purpose: <meta> CSP ignores it, browsers warn.
         Set it as a response header instead in real deployment. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://jsonplaceholder.typicode.com; object-src 'none'; base-uri 'self'"
    />
    <title>Employee Records</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
